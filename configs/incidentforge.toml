# Sample layered configuration for IncidentForge (RF17)
# Precedence: CLI flags > INCIDENTFORGE_* env vars > incidentforge.toml > defaults

[incidentforge]
topology = "configs/topology_sample.yaml"
failures = "configs/failures_default.yaml"
failures_mode = "extend"
output_dir = "output"
state_dir = ".incidentforge"

[llm]
model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
temperature = 0.3
max_tokens = 4000
timeout = 120.0
max_retries = 3

[generation]
concurrency = 4
seed = 42
# max_tokens_budget = 500000

[dedup]
similarity_threshold = 0.92
minhash_threshold = 0.85

[export]
export_formats = ["jsonl", "markdown"]
